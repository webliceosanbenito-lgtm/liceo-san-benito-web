name: Probar escritura GitHub App LSB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba-escritura:
    runs-on: ubuntu-latest

    steps:
      - name: Generar token de la GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LSB_GITHUB_APP_ID }}
          private-key: ${{ secrets.LSB_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: liceo-san-benito-web

      - name: Crear archivo de prueba
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          CONTENT=$(printf 'Prueba de escritura de la GitHub App del Liceo San Benito.\n' | base64 -w 0)

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/contents/imagenes/prueba-github-app.txt \
            -f message="Prueba segura de escritura con GitHub App" \
            -f content="$CONTENT"
